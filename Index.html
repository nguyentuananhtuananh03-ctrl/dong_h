<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Nhỏ Của Sếp 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4a4a4a;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #ff6b81;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        /* Clock Widget */
        .clock-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .time {
            font-size: 36px;
            font-weight: 700;
            color: #ff4757;
            letter-spacing: 2px;
        }

        .date {
            font-size: 13px;
            color: #747d8c;
            margin-top: 4px;
        }

        /* Quote Widget */
        .quote-card {
            background: #fff0f3;
            border-left: 4px solid #ff6b81;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .quote-text {
            font-size: 14px;
            font-style: italic;
            color: #57606f;
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        /* Todo List */
        .todo-section {
            text-align: left;
        }

        .todo-title {
            font-size: 16px;
            font-weight: 700;
            color: #2f3542;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #ffeaa7;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff6b81;
        }

        .add-btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, background 0.3s;
        }

        .add-btn:hover {
            background: #ff4757;
            transform: scale(1.05);
        }

        ul {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        li {
            background: white;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            font-size: 14px;
            transition: all 0.2s;
        }

        li.completed span {
            text-decoration: line-through;
            color: #a4b0be;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff6b81;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #a4b0be;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Góc Nhỏ Của Sếp 🌸</h1>
    <p class="subtitle">Chúc Sếp một ngày tràn đầy niềm vui và may mắn!</p>

    <!-- Clock -->
    <div class="clock-card">
        <div class="time" id="clock">00:00:00</div>
        <div class="date" id="date">Đang tải ngày tháng...</div>
    </div>

    <!-- Daily Quote -->
    <div class="quote-card">
        <button class="refresh-btn" onclick="getRandomQuote()">🔄</button>
        <div class="quote-text" id="quote">"Mỗi ngày mới là một cơ hội tuyệt vời để Sếp toả sáng!" ✨</div>
    </div>

    <!-- Todo List -->
    <div class="todo-section">
        <div class="todo-title">📌 Việc cần làm hôm nay</div>
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Viết mục tiêu mới...">
            <button class="add-btn" onclick="addTodo()">Thêm</button>
        </div>
        <ul id="todoList"></ul>
    </div>

    <footer>Trợ lý Rikka Saga hỗ trợ Sếp 🎀</footer>
</div>

<script>
    // 1. Đồng hồ thời gian thực
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        document.getElementById('clock').textContent = `{hours}:{minutes}:{seconds}`;

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('vi-VN', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Lời chúc / Lời động lực ngẫu nhiên
    const quotes = [
        "Mỗi ngày mới là một cơ hội tuyệt vời để Sếp toả sáng! ✨",
        "Sếp nhớ uống đủ nước và nghỉ ngơi hợp lý nhé! 💧🌸",
        "Cố gắng một chút nữa thôi, Sếp làm tốt lắm rồi! 💪💖",
        "Nụ cười của Sếp hôm nay sẽ làm mọi thứ tươi sáng hơn! 😊🎀",
        "Chúc Sếp hoàn thành tốt mọi mục tiêu đã đề ra nha! 🎯✨"
    ];

    function getRandomQuote() {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        document.getElementById('quote').textContent = `"{quotes[randomIndex]}"`;
    }

    // 3. Quản lý To-Do List với LocalStorage
    let todos = JSON.parse(localStorage.getItem('rikka_todos')) || [
        { text: "Uống một ly nước ấm ☕", completed: false },
        { text: "Mỉm cười đón ngày mới 😊", completed: true }
    ];

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            if (todo.completed) li.classList.add('completed');
            
            li.innerHTML = `
                <span onclick="toggleTodo({index})" style="cursor: pointer;">{todo.text}</span>
                <button class="delete-btn" onclick="deleteTodo({index})">✕</button>
            `;
            list.appendChild(li);
        });
        localStorage.setItem('rikka_todos', JSON.stringify(todos));
    }

    function addTodo() {
        const input = document.getElementById('todoInput');
        const text = input.value.trim();
        if (text) {
            todos.push({ text: text, completed: false });
            input.value = '';
            renderTodos();
        }
    }

    function toggleTodo(index) {
        todos[index].completed = !todos[index].completed;
        renderTodos();
    }

    function deleteTodo(index) {
        todos.splice(index, 1);
        renderTodos();
    }

    // Enter để thêm Todo
    document.getElementById('todoInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') addTodo();
    });

    renderTodos();
</script>

</body>
    </html>
